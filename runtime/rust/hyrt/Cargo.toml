[package]
name = "hyrt"
version = "0.1.0"
edition = "2021"
description = "The Hybrid runtime bridge — extern C wrappers over the pinned crates (sha3, serde_json). Loaded as ONE staticlib per binary; panic=abort at the boundary (never unwind across — SPEC prime directive 6)."

[lib]
crate-type = ["staticlib"]

[dependencies]
# Pinned EXACT versions (SPEC M6: no ranges — reproducibility is a Phase-5
# requirement adopted now; changes are Decision Log entries).
sha3 = "=0.10.8"
serde_json = "=1.0.140"
regex = "=1.11.1"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
