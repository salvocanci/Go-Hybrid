# Heavy shard fleet (dispatch-only) — SPEC.md §2 "GitHub Actions shard fleet".
# Never runs on push. Inputs: sha (pinned commit), job (jobs/<name>/ dir name),
# shards (count), max-parallel. Shards run the SAME generic runner as the sandbox
# and Kaggle (tools/runner/runner.py) — one code path (SPEC §14.1).
# Sharding is deterministic (shard id = i mod n) once a test corpus exists;
# for now every shard runs the same smoke job to measure the fleet itself.
name: heavy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Pinned commit SHA to run"
        required: true
      job:
        description: "Job name under jobs/ (dir name)"
        required: true
        default: "001-spike0-kaggle-smoke"
      shards:
        description: "Shard count"
        required: true
        default: "4"
      max-parallel:
        description: "Max concurrent shards"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        run: |
          n="${{ github.event.inputs.shards }}"
          python3 -c "import json,sys; print('matrix=' + json.dumps(list(range(int(sys.argv[1])))))" "$n" >> "$GITHUB_OUTPUT"

  shard:
    needs: gen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event.inputs.max-parallel) }}
      matrix:
        shard: ${{ fromJson(needs.gen.outputs.matrix) }}
    steps:
      - name: Checkout pinned SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.sha }}
      - name: Run job via generic runner
        run: |
          set -e
          python3 tools/runner/runner.py "jobs/${{ github.event.inputs.job }}/job.json" \
            --results-dir "results/shard-${{ matrix.shard }}" \
            --repo-dir "$GITHUB_WORKSPACE"
      - name: Always produce a shard summary (even on failure)
        if: always()
        run: |
          if [ ! -f "results/shard-${{ matrix.shard }}/summary.json" ]; then
            mkdir -p "results/shard-${{ matrix.shard }}"
            echo '{"schema":"go-hybrid-job-summary/1","job":"${{ github.event.inputs.job }}","tier":"actions-shard-${{ matrix.shard }}","ok":false,"error":"runner did not produce summary"}' \
              > "results/shard-${{ matrix.shard }}/summary.json"
          fi
          cp "results/shard-${{ matrix.shard }}/summary.json" "shard-${{ matrix.shard }}-summary.json"
      - name: Upload shard artifact (short retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}-summary.json
          retention-days: 1

  reduce:
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all shard summaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: shards
      - name: Merge into fleet summary
        run: |
          python3 - <<'EOF'
          import glob, json, datetime
          merged = {
            "schema": "go-hybrid-fleet-summary/1",
            "job": "${{ github.event.inputs.job }}",
            "sha": "${{ github.event.inputs.sha }}",
            "workflow_run": "${{ github.run_id }}",
            "generated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "shards": [],
          }
          ok = True
          for p in sorted(glob.glob("shards/*/shard-*-summary.json")):
              s = json.load(open(p))
              merged["shards"].append({
                  "shard": p.split("shard-")[-1].split("-summary")[0],
                  "ok": s.get("ok"),
                  "wall_clock_s": s.get("wall_clock_s"),
                  "hardware": {"nproc": s.get("hardware", {}).get("nproc"), "mem": s.get("hardware", {}).get("mem")},
                  "steps": [{"name": x["name"], "exit": x["exit"], "dur_s": x["dur_s"]} for x in s.get("steps", [])],
              })
              ok = ok and bool(s.get("ok"))
          merged["ok"] = ok
          merged["shard_count"] = len(merged["shards"])
          json.dump(merged, open("fleet-summary.json", "w"), indent=2)
          print(json.dumps(merged, indent=2)[:4000])
          EOF
      - name: Upload fleet summary (3-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-summary
          path: fleet-summary.json
          retention-days: 3
