# Kaggle tier dispatch from Actions (SPEC.md §2 / §14.1).
# Submits a job to the Kaggle worker from a GitHub runner, waits, fetches.
# Auth: KAGGLE_API_TOKEN repo secret (set 2026-10-12) -> ~/.kaggle/access_token
# (mode 600) on the runner only; never printed, never committed, removed at
# the end. The kernel itself needs NO secrets — it clones the public repo at
# the pinned SHA. One code path: tools/job.py submit/wait/fetch (same as the
# sandbox uses). Never runs on push; dispatch-only like heavy.yml.
name: kaggle

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job name under jobs/ (dir name)"
        required: true
        default: "001-spike0-kaggle-smoke"
      sha:
        description: "Pinned commit SHA to run (empty = dispatch HEAD)"
        required: false
        default: ""
      wait-minutes:
        description: "Max minutes to wait for the Kaggle run"
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pinned SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.inputs.sha || github.sha }}
      - name: Install kaggle CLI (pinned 2.2.4) into a venv
        run: |
          set -e
          python3 -m venv "$HOME/kvenv"
          "$HOME/kvenv/bin/pip" install --quiet kaggle==2.2.4
          "$HOME/kvenv/bin/kaggle" --version
      - name: Authenticate (repo secret -> runner file, mode 600)
        run: |
          set -e
          umask 077
          mkdir -p "$HOME/.kaggle"
          printf '%s' "${{ secrets.KAGGLE_API_TOKEN }}" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          # prove auth works without ever printing the token:
          "$HOME/kvenv/bin/kaggle" kernels list --mine 2>&1 | head -3
      - name: Submit job (injects pinned SHA into the kernel)
        run: |
          set -e
          export KAGGLE_CLI="$HOME/kvenv/bin/kaggle"
          python3 tools/job.py kaggle submit "jobs/${{ github.event.inputs.job }}"
      - name: Wait for the run to finish
        run: |
          set -e
          export KAGGLE_CLI="$HOME/kvenv/bin/kaggle"
          python3 tools/job.py kaggle wait "${{ github.event.inputs.wait-minutes }}"
      - name: Fetch output + summary (even on failure)
        if: always()
        run: |
          export KAGGLE_CLI="$HOME/kvenv/bin/kaggle"
          python3 tools/job.py kaggle fetch "jobs/${{ github.event.inputs.job }}" || echo "(fetch produced nothing)"
      - name: Upload result artifact (short retention)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-${{ github.event.inputs.job }}
          path: |
            jobs/${{ github.event.inputs.job }}/result/summary.json
            jobs/${{ github.event.inputs.job }}/result/raw/
          retention-days: 3
          if-no-files-found: ignore
      - name: Remove token file (defense in depth)
        if: always()
        run: rm -f "$HOME/.kaggle/access_token"
