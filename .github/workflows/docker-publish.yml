# docker-publish (dispatch-only) — PLAN row 12 (discussion #1 ask 2):
# the pinned-toolchain CI image on GHCR. Never runs on push; same fleet
# discipline as release-matrix: the image is SMOKE-TESTED before anything
# is pushed — pins, a bridge-free program, AND a bridge program (cgo links
# the image's prebuilt libhyrt.a).
name: docker-publish

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Pinned commit SHA to build from"
        required: true
      version:
        description: "Image tag suffix (e.g. v0.1.0) — also tagged latest"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-smoke-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Build image
        # GHCR requires lowercase repository names (Go-Hybrid → go-hybrid)
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.version }}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          docker build -t "$IMG" .
      - name: Smoke from the IMAGE (pins + bridge-free + bridge program)
        # Every container mounts the checkout at /work — binaries built in
        # one container run in the next (each docker run is a fresh fs).
        run: |
          set -e
          IMG="${{ env.IMG }}"   # already includes the version tag
          # (a) toolchain pins inside the image + the CLI answers
          docker run --rm "$IMG" sh -c 'go version | grep -q go1.26.9 && hyb explain E0002 >/dev/null && echo pins-ok'
          # (b) bridge-free program: build + run inside the image
          docker run --rm -v "$PWD:/work" -w /work "$IMG" \
            hyb build examples/01-hello/program.hy -o /work/hello-img
          docker run --rm -v "$PWD:/work" -w /work "$IMG" \
            /work/hello-img | grep -q "hello, Hybrid!"
          # (c) BRIDGE program: cgo links the image's prebuilt staticlib
          docker run --rm -v "$PWD:/work" -w /work "$IMG" \
            hyb build examples/05-json-transform/program.hy -o /work/json-img
          docker run --rm -v "$PWD:/work" -w /work "$IMG" \
            /work/json-img | grep -q '"ada"'
          echo "image smoke: PASS (pins + bridge-free + serde_json bridge)"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (versioned + latest)
        env:
          IMG: ${{ env.IMG }}
        run: |
          REPO="${IMG%:*}"   # IMG already carries the version tag
          docker push "$IMG"
          docker tag "$IMG" "$REPO:latest"
          docker push "$REPO:latest"
      - name: Published tags
        env:
          IMG: ${{ env.IMG }}
        run: echo "$IMG and $IMG:latest are live"
