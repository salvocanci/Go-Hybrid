name: Soundness report
description: A program the checker ACCEPTS but that is not actually safe — this is a P0 by definition (SPEC §10)
title: "[soundness] "
labels: ["soundness"]
body:
  - type: markdown
    attributes:
      value: |
        **This label is reserved for the worst class of bug we have**: a program
        the Tier-0 checker accepts that can still race / violate the ownership
        model. Per [GUARANTEES.md](https://github.com/limitlessprojects/Go-Hybrid/blob/main/GUARANTEES.md),
        every accepted program was *proven* sendable — an accepted-but-unsound
        program means the proof is wrong, so we publish severity + status
        publicly and land a corpus regression test **before** the fix.
  - type: textarea
    id: program
    attributes:
      label: The smallest .hy program that demonstrates it
      description: Please minimize — one file, the fewer lines the better. Include the exact `hyb build`/`hyb check` command and version (`hyb --version` or the release tag).
      placeholder: |
        // prog.hy (v0.1.0)
        fn main() { ... }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the checker should say
      description: The diagnostic you expected (a HYB-Exxxx code, or "reject") and why the program is unsafe.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What it actually said
      description: Paste the full checker output (or "OK (0 diagnostics)").
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Claimed severity
      description: Your assessment — we will re-derive it and publish the final rating either way.
      options:
        - "P0 — data race reachable in the checked subset"
        - "P1 — ownership violation without a race (memory-safety claim affected)"
        - "P2 — claim-precision bug (accepted value should have been unproven)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Which Tier-0 rule (SPEC-LANGUAGE §9) you believe is involved, related programs, platform.
    validations:
      required: false
