[package]
name = "hy-diag"
version.workspace = true
edition.workspace = true
license.workspace = true

# hy-diag — the diagnostic registry v1 scaffold (PLAN.md Phase-1 item;
# SPEC-LANGUAGE.md §9.6 normative).
#
# What lives here:
#   * the HYB-Exxxx registry (data/diagnostics.json, embedded at compile time)
#   * the Diagnostic / Severity / FixIt / Span data model
#   * the JSON envelope renderer ({"diagnostics":[...]} — an OBJECT, per spec)
#   * `explain` support (the offline reference page per code)
#
# Registry discipline (normative): append-only, never renumbered, never
# reused; a retired code leaves a permanent hole.  Severity assert: E8nnn
# (lint) is warnings-only and can never fail a build — debug-asserted here
# and unit-tested.

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
