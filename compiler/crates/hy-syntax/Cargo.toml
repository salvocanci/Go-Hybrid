[package]
name = "hy-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

# hy-syntax — lexer + recursive-descent parser + AST for the Hybrid language
# subset pinned by tests/checker-corpus (20 programs), examples/ (ten target
# programs), and spikes/spike6-ownership/work (ten programs).
#
# The AST (src/ast.rs) is a cross-component contract owned by the lead; the
# lexer and parser are owned by this crate.  Parser tests must parse all 40
# real .hy files listed in tests/parse_all.rs.

[dependencies]
hy-diag = { path = "../hy-diag" }
